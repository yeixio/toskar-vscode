name: Release

# A tag v<version> publishes that version to the Visual Studio Marketplace and
# Open VSX, so Cursor, Windsurf, and VSCodium get it too. The Marketplace trusts
# this workflow through the YeixioLLC publisher's Trusted Publishing policy, so
# it needs no token. OVSX_PAT is the Open VSX publisher's token.
on:
  push:
    tags: ['v*']

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ${{ fromJSON(vars.TRUSTED_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: The tag matches the version, and the changelog has it
        run: |
          version="$(node -p "require('./package.json').version")"
          test "$GITHUB_REF_NAME" = "v$version"
          grep -qx "## $version" CHANGELOG.md
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm package
      - name: Visual Studio Marketplace
        run: pnpm exec vsce publish --oidc --no-dependencies --packagePath toskar-*.vsix
      - name: Open VSX
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: pnpm exec ovsx publish toskar-*.vsix
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" toskar-*.vsix --title "Toskar for VS Code $GITHUB_REF_NAME" --notes "See CHANGELOG.md."
