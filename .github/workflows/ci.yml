name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  extension:
    runs-on: ${{ fromJSON(vars.CI_RUNS_ON || '"ubuntu-latest"') }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      # Each job gets its own pnpm: self-hosted runners share a home folder.
      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # The package a release would publish builds, with its manifest checked.
      - run: pnpm package
      - uses: actions/upload-artifact@v4
        with:
          name: toskar-vsix
          path: '*.vsix'
          retention-days: 7

  # The extension in a real VS Code, against a real Toskar with a scripted
  # llama-server. On GitHub's runner, not a home one: VS Code needs a screen and
  # system libraries the home runners' user can't install, and its download
  # stays off the home connection.
  vscode:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
        with:
          dest: ${{ runner.temp }}/setup-pnpm
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - name: A screen for VS Code
        run: sudo apt-get update -q && sudo apt-get install -y -q xvfb
      # Only changing the VS Code version in run.ts downloads it again.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/toskar-vscode-test
          key: vscode-test-${{ hashFiles('test/e2e/run.ts') }}
      - name: The latest Toskar
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          case "$(uname -m)" in aarch64 | arm64) arch=arm64 ;; *) arch=amd64 ;; esac
          tag="$(gh release view --repo yeixio/toskar-core --json tagName --jq .tagName)"
          dir="$HOME/.cache/toskar-vscode-test/core/$tag-$arch"
          if [ ! -x "$dir/toskar" ]; then
            work="$(mktemp -d)"
            gh release download "$tag" --repo yeixio/toskar-core --pattern "toskar-*-linux-$arch-headless.tar.gz" --dir "$work"
            tar -xzf "$work"/*.tar.gz -C "$work"
            mkdir -p "$(dirname "$dir")"
            mv "$work"/toskar-*-headless "$dir"
          fi
          echo "TOSKAR_CORE=$dir/toskar" >> "$GITHUB_ENV"
      - run: xvfb-run -a pnpm test:e2e
